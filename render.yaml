services:
  - type: web
    name: backend
    env: docker
    repo: https://github.com/novikhasiregar/testing-devops
    branch: devs
    dockerfilePath: ./backend/Dockerfile
    autoDeploy: true
    plan: free
    envVars: 
      - key: PORT
        value: 5000


  - type: web
    name: frontend
    env: docker
    repo: https://github.com/novikhasiregar/testing-devops
    branch: devs
    dockerfilePath: ./frontend/Dockerfile
    autoDeploy: true
    plan: free
