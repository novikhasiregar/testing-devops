services:
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=devopsvika
      - POSTGRES_PASSWORD=secret123
      - POSTGRES_DB=dbku
    ports:
      - "5002:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devopsvika -d dbku"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://devopsvika:secret123@db:5432/dbku
    ports:
      - "5000:5000"

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./backend/prometheus.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
      
  grafana:
    image: grafana/grafana
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=Linux123&!
    ports:
      - "3001:3000"

  frontend:
    build: ./frontend
    ports:
      - "5001:5001"
    depends_on:
      - backend
  
